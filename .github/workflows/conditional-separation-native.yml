# Independently reviewed controller policy; native/runtime admission remains separate.
# Feature-only automatic push; no main/later-PR native coverage.
# Later use requires independently admitted exact controller/source manual dispatch.
# Availability after branch deletion/merge is not promised; non-main guards remain.
name: conditional-separation-native-prospective-v2

on:
  push:
    branches: ['infrastructure/conditional-separation-package-docfix-20261031']
    paths:
      - 'conditional_separation/**'
      - '.github/workflows/conditional-separation-native.yml'
  workflow_dispatch:
    inputs:
      controller_sha:
        description: 'Independently reviewed exact controller commit (must equal actual workflow SHA)'
        required: true
      source_sha:
        description: 'Exact same-repository PR feature head to test; parent independently binds PR1821'
        required: true

permissions:
  contents: read

concurrency:
  group: conditional-separation-native-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-source:
    if: ${{ github.repository == 'khanukov/p-np2' && github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'master' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            python-arch: x64
          - runner: macos-15
            python-arch: arm64

    env:
      CI_RUNNER_LABEL: ${{ matrix.runner }}
      CI_PYTHON_ARCH: ${{ matrix.python-arch }}
      CI_EXPECTED_HEAD: ${{ inputs.source_sha || github.sha }}
      CI_CONTROLLER_SHA: ${{ inputs.controller_sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      LEAN_NUM_THREADS: '2'
    defaults:
      run:
        shell: python
    steps:
      - name: Native Python (3.12 series; resolved patch recorded in job)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
          check-latest: false
      - name: Package-only raw Git blobs at the exact public feature head
        working-directory: ${{ github.workspace }}
        run: |
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          if sys.flags.optimize:
              raise SystemExit('optimized source admission rejected')
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          kind, ref = os.environ['GITHUB_EVENT_NAME'], os.environ['GITHUB_REF']
          repo = event['repository']
          if repo.get('private') is not False or repo['full_name'] != 'khanukov/p-np2':
              raise ValueError('independently admitted public controller repository required')
          if not ref.startswith('refs/heads/') or ref in {'refs/heads/main', 'refs/heads/master'}:
              raise ValueError('non-main controller required')
          controller, head = os.environ['CI_CONTROLLER_SHA'], os.environ['CI_EXPECTED_HEAD']
          if any(not re.fullmatch('[0-9a-f]{40}', s) or s == '0'*40 for s in (controller, head)):
              raise ValueError('literal nonzero controller/source SHAs required')
          if controller != os.environ['GITHUB_SHA'] or controller != os.environ['GITHUB_WORKFLOW_SHA']:
              raise ValueError('controller ref drift; no mutable-ref trust')
          if kind == 'push':
              if ref != 'refs/heads/infrastructure/conditional-separation-package-docfix-20261031' or head != controller:
                  raise ValueError('only the authorized reviewed feature publication push')
          elif kind == 'workflow_dispatch':
              if event.get('inputs') != {'controller_sha': controller, 'source_sha': head}:
                  raise ValueError('dispatch controller/source input binding')
          else:
              raise ValueError('PR-controlled workflow definitions are not trusted controllers')
          temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          bare, source = temp/'g', temp/'s'
          if bare.exists() or bare.is_symlink() or source.exists() or source.is_symlink():
              raise ValueError('fresh private source roots required')
          def git(*args):
              return subprocess.run(['git', '--git-dir', str(bare), *args], check=True, stdout=subprocess.PIPE).stdout
          subprocess.run(['git', 'init', '--bare', str(bare)], check=True)
          url = 'https://github.com/'+repo['full_name']+'.git'
          git('fetch', '--depth=1', '--no-tags', '--no-recurse-submodules', url, controller)
          if git('rev-parse', 'FETCH_HEAD^{commit}').decode().strip() != controller:
              raise ValueError('fetched controller mismatch')
          for relative, name, expected in (
              ('ci/package_source_v1.py', 'conditional-package-source-v1.py', 'ffdd862bfadf3845ae86373eb806a6f2b99192abfe0e00d860533aae9c053b2f'),
              ('ci/trusted_controls_v1.py', 'trusted-native-controls-v1.py', 'ca68835ba4462750a8e2a340f19dc98e9e0228ea36015e5f29be1a4403717a03')):
              code = git('cat-file', 'blob', controller+':conditional_separation/'+relative)
              if hashlib.sha256(code).hexdigest() != expected:
                  raise ValueError('controller helper differs from independently reviewed workflow pin')
              with (temp/name).open('xb') as stream:
                  stream.write(code)
          git('fetch', '--depth=1', '--no-tags', '--no-recurse-submodules', url, head)
          if git('rev-parse', 'FETCH_HEAD^{commit}').decode().strip() != head:
              raise ValueError('fetched source mismatch')
          git('update-ref', '--no-deref', 'HEAD', head)
          subprocess.run([sys.executable, '-I', '-S', '-B', str(temp/'conditional-package-source-v1.py'),
                          str(bare), head, str(source), '--short-layout-v1'], check=True)
          subprocess.run([sys.executable, '-I', '-S', '-B', str(temp/'trusted-native-controls-v1.py'),
                          '--check', 'ca68835ba4462750a8e2a340f19dc98e9e0228ea36015e5f29be1a4403717a03', str(source/'p')], check=True)
      - name: Verified Elan asset and exact Lean toolchain
        working-directory: ${{ runner.temp }}/s/p
        run: |
          import os, subprocess, sys
          from pathlib import Path
          helper = Path(os.environ['RUNNER_TEMP'])/'trusted-native-controls-v1.py'
          anchor = 'ca68835ba4462750a8e2a340f19dc98e9e0228ea36015e5f29be1a4403717a03'
          # Compile only authenticated bytes: -B alone does not exclude cached helpers.
          stub = ("import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); "
                  "assert hashlib.sha256(b).hexdigest()==sys.argv[2], 'dispatcher hash'; "
                  "sys.argv=[str(p),*sys.argv[3:]]; "
                  "exec(compile(b,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})")
          subprocess.run([sys.executable, '-I', '-S', '-B', '-c', stub, str(helper), anchor,
                          '--run', anchor, str(Path.cwd()), 'ci/native_ci_v1.py', 'bootstrap'], check=True)
      - name: Exact external foundations only (no project cache)
        working-directory: ${{ runner.temp }}/s/p
        run: |
          import os, subprocess, sys
          from pathlib import Path
          helper = Path(os.environ['RUNNER_TEMP'])/'trusted-native-controls-v1.py'
          anchor = 'ca68835ba4462750a8e2a340f19dc98e9e0228ea36015e5f29be1a4403717a03'
          # Compile only authenticated bytes: -B alone does not exclude cached helpers.
          stub = ("import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); "
                  "assert hashlib.sha256(b).hexdigest()==sys.argv[2], 'dispatcher hash'; "
                  "sys.argv=[str(p),*sys.argv[3:]]; "
                  "exec(compile(b,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})")
          subprocess.run([sys.executable, '-I', '-S', '-B', '-c', stub, str(helper), anchor,
                          '--run', anchor, str(Path.cwd()), 'ci/native_ci_v1.py', 'foundations'], check=True)
      - name: Fresh project source build, root audit and real unit tests
        working-directory: ${{ runner.temp }}/s/p
        run: |
          import os, subprocess, sys
          from pathlib import Path
          helper = Path(os.environ['RUNNER_TEMP'])/'trusted-native-controls-v1.py'
          anchor = 'ca68835ba4462750a8e2a340f19dc98e9e0228ea36015e5f29be1a4403717a03'
          # Compile only authenticated bytes: -B alone does not exclude cached helpers.
          stub = ("import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); "
                  "assert hashlib.sha256(b).hexdigest()==sys.argv[2], 'dispatcher hash'; "
                  "sys.argv=[str(p),*sys.argv[3:]]; "
                  "exec(compile(b,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})")
          subprocess.run([sys.executable, '-I', '-S', '-B', '-c', stub, str(helper), anchor,
                          '--run', anchor, str(Path.cwd()), 'ci/native_ci_v1.py', 'build'], check=True)
      - name: External attempts, exact R rejections and conditional consumer
        working-directory: ${{ runner.temp }}/s/p
        run: |
          import os, subprocess, sys
          from pathlib import Path
          helper = Path(os.environ['RUNNER_TEMP'])/'trusted-native-controls-v1.py'
          anchor = 'ca68835ba4462750a8e2a340f19dc98e9e0228ea36015e5f29be1a4403717a03'
          # Compile only authenticated bytes: -B alone does not exclude cached helpers.
          stub = ("import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); "
                  "assert hashlib.sha256(b).hexdigest()==sys.argv[2], 'dispatcher hash'; "
                  "sys.argv=[str(p),*sys.argv[3:]]; "
                  "exec(compile(b,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})")
          subprocess.run([sys.executable, '-I', '-S', '-B', '-c', stub, str(helper), anchor,
                          '--run', anchor, str(Path.cwd()), 'ci/native_ci_v1.py', 'consumers'], check=True)
      - name: Stage bounded owned evidence even on failure
        working-directory: ${{ runner.temp }}/s/p
        if: ${{ always() }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          helper = Path(os.environ['RUNNER_TEMP'])/'trusted-native-controls-v1.py'
          anchor = 'ca68835ba4462750a8e2a340f19dc98e9e0228ea36015e5f29be1a4403717a03'
          # Compile only authenticated bytes: -B alone does not exclude cached helpers.
          stub = ("import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); "
                  "assert hashlib.sha256(b).hexdigest()==sys.argv[2], 'dispatcher hash'; "
                  "sys.argv=[str(p),*sys.argv[3:]]; "
                  "exec(compile(b,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})")
          subprocess.run([sys.executable, '-I', '-S', '-B', '-c', stub, str(helper), anchor,
                          '--run', anchor, str(Path.cwd()), 'ci/export_ci_evidence_v2.py'], check=True)
      - name: Transfer only the bounded evidence tree
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conditional-ci-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/conditional-separation-evidence-v2
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      # Missing/killed executor terminals remain UNKNOWN; artifact existence is not PASS.
