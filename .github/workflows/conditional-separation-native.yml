# Locally installed source only; server/native runs and exact-head acceptance pending.
# Integrate the companion files under conditional_separation/ci and its tests;
# reconcile PACKAGE_FILES.json before this workflow can verify source identity.
name: conditional-separation-native-prospective-v2

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'conditional_separation/**'
      - '.github/workflows/conditional-separation-native.yml'
  push:
    branches-ignore: [main, master]
    paths:
      - 'conditional_separation/**'
      - '.github/workflows/conditional-separation-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conditional-separation-native-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-source:
    if: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'master') }}
    # Explicit standard labels; neither -large nor -xlarge is allocated.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: ubuntu-24.04
            python-arch: x64
          - runner: macos-15
            python-arch: arm64
          - runner: windows-2022
            python-arch: x64
    env:
      CI_RUNNER_LABEL: ${{ matrix.runner }}
      CI_PYTHON_ARCH: ${{ matrix.python-arch }}
      CI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      LEAN_NUM_THREADS: '2'
    defaults:
      run:
        shell: python
        working-directory: source/conditional_separation
    steps:
      - name: Package-only source at exact PR head or feature event head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          clean: false
          submodules: false
          lfs: false
          allow-unsafe-pr-checkout: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /conditional_separation/
      - name: Native Python (3.12 series; resolved patch recorded in job)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
          check-latest: false
      - name: Verified Elan asset and exact Lean toolchain
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', 'ci/native_ci_v1.py', 'bootstrap'], check=True)
      - name: Exact external foundations only (no project cache)
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', 'ci/native_ci_v1.py', 'foundations'], check=True)
      - name: Fresh project source build, root audit and real unit tests
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', 'ci/native_ci_v1.py', 'build'], check=True)
      - name: External attempts, exact R rejections and conditional consumer
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', 'ci/native_ci_v1.py', 'consumers'], check=True)
      - name: Stage bounded owned evidence even on failure
        if: ${{ always() }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-B', 'ci/export_ci_evidence_v2.py'], check=True)
      - name: Transfer only the bounded evidence tree
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conditional-ci-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/conditional-separation-evidence-v2
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      # Best effort on cancellation/timeouts; no stage or upload can run after a
      # killed runner. Missing executor terminals remain UNKNOWN in evidence.
