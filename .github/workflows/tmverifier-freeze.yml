name: TMVerifier Freeze Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  protected-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .freeze-policy-base
          persist-credentials: false

      - name: Reject ordinary changes to frozen or policy paths
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluateFreezeDiff, lakefileIncludesModules } = require(
              `${process.env.GITHUB_WORKSPACE}/.freeze-policy-base/.github/scripts/tmverifier-freeze-policy.js`
            );
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const labels = pull.labels.map(label => label.name);
            const head = pull.head.sha;
            const changedPaths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean)
            );
            let lakefileComplete = true;
            if (changedPaths.includes('lakefile.lean')) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: pull.head.repo.owner.login,
                  repo: pull.head.repo.name,
                  path: 'lakefile.lean',
                  ref: head,
                });
                const text = Buffer.from(data.content, data.encoding).toString('utf8');
                const manifest = require(
                  `${process.env.GITHUB_WORKSPACE}/.freeze-policy-base/spec/tmverifier_freeze.json`
                );
                const modules = Object.keys(manifest.files).map(path =>
                  path.replace(/^pnp3\//, '').replace(/\.lean$/, '').replaceAll('/', '.')
                );
                lakefileComplete = lakefileIncludesModules(text, modules);
              } catch (error) {
                core.warning(`Could not verify head lakefile: ${error.message}`);
                lakefileComplete = false;
              }
            }
            const attestation = `/tmverifier-unfreeze ${head}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const ownerAttestedHead = comments.some(comment =>
              comment.user?.login === context.repo.owner && comment.body?.trim() === attestation
            );
            const result = evaluateFreezeDiff(files, labels, {
              changedFiles: pull.changed_files,
              ownerAttestedHead,
              lakefileComplete,
            });
            const paths = result.protectedFiles.length
              ? `\n${result.protectedFiles.join('\n')}`
              : '';
            if (!result.ok) {
              core.setFailed(`${result.message}${paths}`);
            } else {
              core.info(`${result.message}${paths}`);
            }
