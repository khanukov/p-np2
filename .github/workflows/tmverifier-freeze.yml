name: TMVerifier Freeze Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Reject ordinary changes to frozen or policy paths
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const unfreeze = labels.includes('tmverifier-unfreeze');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const exact = new Set([
              'spec/tmverifier_freeze.json',
              'spec/version_manifest.toml',
              'lakefile.lean',
              'scripts/check.sh',
              'scripts/check_tmverifier_freeze.py',
              'scripts/check_tmverifier_freeze.sh',
              'scripts/test_tmverifier_freeze.py',
              'scripts/test_tmverifier_freeze.sh',
              'pnp3/Docs/TMVERIFIER_FREEZE.md',
              '.github/workflows/tmverifier-freeze.yml',
              '.github/workflows/ci.yml',
              '.github/workflows/lean.yml',
              '.github/workflows/nightly-unconditional.yml',
              '.github/CODEOWNERS',
              '.gitattributes',
            ]);
            const protectedFiles = files
              .map(file => file.filename)
              .filter(path => path.startsWith('pnp3/Complexity/TMVerifier/') || exact.has(path));
            if (protectedFiles.length && !unfreeze) {
              core.setFailed(
                `Frozen TMVerifier/policy paths changed without maintainer label ` +
                `'tmverifier-unfreeze':\n${protectedFiles.join('\n')}`
              );
            }
            if (protectedFiles.length) {
              core.info(`Explicit unfreeze review requested for:\n${protectedFiles.join('\n')}`);
            } else {
              core.info('No frozen TMVerifier or freeze-policy paths changed.');
            }
